spring.application.name=queueflow

# Local development defaults; environment variables can override each setting.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:queueflow}
spring.datasource.username=${POSTGRES_USER:queueflow}
spring.datasource.password=${POSTGRES_PASSWORD:queueflow_dev}

# Update the local schema as entities change; keep database access in the service layer.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:queueflow}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:queueflow_dev}

management.endpoints.web.exposure.include=health,info
# Show component status so local connectivity can be verified without exposing details.
management.endpoint.health.show-components=always
